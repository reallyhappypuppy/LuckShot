<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h2>🎯 Room {{ code }}</h2>
<p>{{ username }}</p>

<h3 id="status"></h3>
<h3 id="bullets"></h3>

<div id="players"></div>

<button onclick="start()">Start</button>
<a href="/rooms"><button>Leave</button></a>

<hr>

<h3>💬 Chat</h3>

<button onclick="mode='room'">Room</button>
<button onclick="mode='global'">World</button>

<div id="chatBox"></div>

<input id="msg">
<button onclick="send()">Send</button>

</div>

<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

<script>
const socket = io()
const username = "{{ username }}"
const room = "{{ code }}"

socket.emit("join", {room, username})

socket.on("update", (roomData)=>{

    const real = roomData.bullets.filter(b=>b==="real").length
    const blank = roomData.bullets.filter(b=>b==="blank").length

    document.getElementById("bullets").innerText =
        `🔴 ${real} | ⚪ ${blank}`

    document.getElementById("players").innerHTML =
        roomData.players.map(p=>{
            let isAlive = roomData.alive.includes(p)
            let isTurn = roomData.players[roomData.turn] === p

            return `
            <div class="player ${isAlive ? 'alive':'dead'} ${isTurn?'turn':''}">
                ${p} ${isAlive ? '🟢':'💀'}
                ${
                    roomData.state === "playing" && isAlive && isTurn
                    ? `<button onclick="shoot('${p}')">Shoot</button>`
                    : ''
                }
            </div>`
        }).join("")

    document.getElementById("status").innerText =
        roomData.state === "waiting" ? "대기중"
        : roomData.state === "playing" ? "턴: " + roomData.players[roomData.turn]
        : "게임 종료"
})

function start(){
    socket.emit("start", {room, username})
}

function shoot(target){
    socket.emit("shoot", {room, shooter:username, target})
}

let mode = "room"

function send(){
    const msg = document.getElementById("msg").value

    if(mode === "room"){
        socket.emit("chat", {username, msg, room})
    } else {
        socket.emit("global_chat", {username, msg})
    }

    document.getElementById("msg").value = ""
}

socket.on("global_chat", (d)=>{
    if(mode === "global"){
        const chat = document.getElementById("chatBox")
        chat.innerHTML += `<div>[🌍] ${d.username}: ${d.msg}</div>`
    }
})

socket.on("chat", (d)=>{
    const chat = document.getElementById("chatBox")
    chat.innerHTML += `<div>${d.username}: ${d.msg}</div>`
})

socket.on("shot", (d)=>{
    alert(`${d.shooter} → ${d.target} (${d.bullet})`)
})

socket.on("game_over", (d)=>{
    alert("Winner: " + d.winner)
})
</script>

</body>
</html>
