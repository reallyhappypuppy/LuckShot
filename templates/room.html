<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

<h2>🎯 Room {{ code }}</h2>
<p>{{ username }}</p>

<h3 id="status"></h3>
<h3 id="bullets"></h3>

<div id="players"></div>

<button onclick="start()">Start</button>
<a href="/rooms"><button>Leave</button></a>

<hr>

<!-- ✅ 채팅 좌우 분리 -->
<div style="display:flex; gap:20px">

<!-- 🏠 ROOM CHAT -->
<div style="width:50%">
<h3>🏠 Room Chat</h3>
<div id="roomChat"></div>

<input id="roomMsg">
<button onclick="sendRoom()">Send</button>
</div>

<!-- 🌍 GLOBAL CHAT -->
<div style="width:50%">
<h3>🌍 Global Chat</h3>
<div id="globalChat"></div>

<input id="globalMsg">
<button onclick="sendGlobal()">Send</button>
</div>

</div>

</div>

<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

<script>
const socket = io()
const username = "{{ username }}"
const room = "{{ code }}"

socket.emit("join", {room, username})

socket.on("update", (roomData)=>{

    const real = roomData.bullets.filter(b=>b==="real").length
    const blank = roomData.bullets.filter(b=>b==="blank").length

    document.getElementById("bullets").innerText =
        `🔴 ${real} | ⚪ ${blank}`

    // ✅ 핵심 수정: myTurn 정의
    const myTurn = roomData.players[roomData.turn_index % roomData.alive.length] === username

    document.getElementById("players").innerHTML =
        roomData.players.map(p=>{
            let isAlive = roomData.alive.includes(p)
            let isTurn = roomData.players[roomData.turn] === p

            return `
            <div class="player ${isAlive ? 'alive':'dead'} ${isTurn?'turn':''}">
                ${p} ${isAlive ? '🟢':'💀'}
                ${
                    roomData.state === "playing" && myTurn && isAlive
                    ? `<button onclick="shoot('${p}')">Shoot</button>`
                    : ''
                }
            </div>`
        }).join("")

    document.getElementById("status").innerText =
        roomData.state === "waiting" ? "대기중"
        : roomData.state === "playing" ? "턴: " + roomData.players[roomData.turn]
        : "게임 종료"
})

function start(){
    socket.emit("start", {room, username})
}

function shoot(target){
    socket.emit("shoot", {room, shooter:username, target})
}

//<!-- ✅ ROOM CHAT -->
function sendRoom(){
    const msg = document.getElementById("roomMsg").value
    socket.emit("chat", {username, msg, room})
    document.getElementById("roomMsg").value = ""
}

//<!-- ✅ GLOBAL CHAT -->
function sendGlobal(){
    const msg = document.getElementById("globalMsg").value
    socket.emit("global_chat", {username, msg})
    document.getElementById("globalMsg").value = ""
}

// 🔹 방 목록에서 접속자 수 표시
socket.on("rooms_update", (rooms)=>{
    const container = document.getElementById("roomList")
    container.innerHTML = Object.entries(rooms).map(([code, room])=>{
        return `
        <div class="player">
            ${room.name} (${room.players.length} players)
            <a href="/room/${code}"><button>Join</button></a>
        </div>`
    }).join("")
})

//<!-- ✅ 채팅 표시 -->
socket.on("chat", (d)=>{
    const chat = document.getElementById("roomChat")
    chat.innerHTML += `<div>${d.username}: ${d.msg}</div>`
    chat.scrollTop = chat.scrollHeight
})

socket.on("global_chat", (d)=>{
    const chat = document.getElementById("globalChat")
    chat.innerHTML += `<div><b>${d.username}</b>: ${d.msg}</div>`
    chat.scrollTop = chat.scrollHeight
})

//<!-- ✅ 채팅 히스토리 (중요) -->
socket.on("chat_history", (msgs)=>{
    const chat = document.getElementById("roomChat")
    chat.innerHTML = msgs.map(m=>`<div>${m.username}: ${m.msg}</div>`).join("")
})

socket.on("global_chat_history", (msgs)=>{
    const chat = document.getElementById("globalChat")
    chat.innerHTML = msgs.map(m=>`<div>${m.username}: ${m.msg}</div>`).join("")
})

//<!-- ✅ 처음 들어올 때 채팅 불러오기 -->
socket.emit("get_global_chat")

socket.on("shot", (d)=>{
    alert(`${d.shooter} → ${d.target} (${d.bullet})`)
})

socket.on("game_over", (d)=>{
    alert("Winner: " + d.winner)
})
</script>

</body>
</html>
